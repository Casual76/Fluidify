[versions]
agp = "8.13.2"
kotlin = "2.3.21"
composeBom = "2026.06.01"
media3 = "1.5.1"
coroutines = "1.9.0"
lifecycle = "2.8.7"
okhttp = "4.12.0"
retrofit = "2.11.0"
serialization = "1.7.3"

[libraries]
androidx-profileinstaller = { module = "androidx.profileinstaller:profileinstaller", version = "1.4.1" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version = "1.15.0" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version = "1.9.3" }
androidx-browser = { module = "androidx.browser:browser", version = "1.8.0" }
androidx-security-crypto = { module = "androidx.security:security-crypto", version = "1.1.0-alpha06" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }

compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-icons-extended = { module = "androidx.compose.material:material-icons-extended" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }

media3-common = { module = "androidx.media3:media3-common", version.ref = "media3" }
media3-session = { module = "androidx.media3:media3-session", version.ref = "media3" }
# The Canvas clip, and every note of the YouTube Music backend. Spotify audio
# still comes from the librespot engine instead.
media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
media3-exoplayer-dash = { module = "androidx.media3:media3-exoplayer-dash", version.ref = "media3" }
media3-ui = { module = "androidx.media3:media3-ui", version.ref = "media3" }

kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-coroutines-guava = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-guava", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-coroutines-play-services = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-play-services", version.ref = "coroutines" }

# The Wearable Data Layer: how the phone and the watch app talk over Bluetooth.
androidx-work-runtime = { module = "androidx.work:work-runtime-ktx", version = "2.11.2" }
wear-input = { module = "androidx.wear:wear-input", version = "1.2.0" }
wear-compose-navigation = { module = "androidx.wear.compose:compose-navigation", version = "1.6.2" }
wear-tiles = { module = "androidx.wear.tiles:tiles", version = "1.6.2" }
wear-tiles-renderer = { module = "androidx.wear.tiles:tiles-renderer", version = "1.6.2" }
wear-protolayout = { module = "androidx.wear.protolayout:protolayout", version = "1.4.2" }
wear-protolayout-expression = { module = "androidx.wear.protolayout:protolayout-expression", version = "1.4.2" }
wear-protolayout-material3 = { module = "androidx.wear.protolayout:protolayout-material3", version = "1.4.2" }
wear-complications-data-source = { module = "androidx.wear.watchface:watchface-complications-data-source-ktx", version = "1.3.0" }
wear-ongoing = { module = "androidx.wear:wear-ongoing", version = "1.1.0" }
wear-phone-interactions = { module = "androidx.wear:wear-phone-interactions", version = "1.1.1" }
play-services-wearable = { module = "com.google.android.gms:play-services-wearable", version = "20.0.1" }

okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-logging = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp" }
retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
retrofit-serialization = { module = "com.squareup.retrofit2:converter-kotlinx-serialization", version.ref = "retrofit" }

desugaring = { module = "com.android.tools:desugar_jdk_libs_nio", version = "2.1.5" }

junit = { module = "junit:junit", version = "4.13.2" }

# Screenshots of the round watch screens, rendered on the JVM.
robolectric = { module = "org.robolectric:robolectric", version = "4.17" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version = "1.2.1" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
roborazzi = { module = "io.github.takahirom.roborazzi:roborazzi", version = "1.76.0" }
roborazzi-compose = { module = "io.github.takahirom.roborazzi:roborazzi-compose", version = "1.76.0" }
roborazzi-junit-rule = { module = "io.github.takahirom.roborazzi:roborazzi-junit-rule", version = "1.76.0" }

coil-compose = { module = "io.coil-kt:coil-compose", version = "2.7.0" }
androidx-palette = { module = "androidx.palette:palette-ktx", version = "1.0.0" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version = "2.8.5" }

# Liquid glass surfaces (Apache-2.0). Compose-native and guarded internally:
# the refraction shader needs API 33, and the library falls back to a plain
# translucent fill below that rather than failing.
backdrop = { module = "io.github.kyant0:backdrop", version = "2.0.0" }
# Capsule and friends, used by the vendored Liquid* components.
kyant-shapes = { module = "io.github.kyant0:shapes", version = "1.2.0" }
# Phosphor (MIT). Apple's SF Symbols are licensed for Apple platforms only, so
# they cannot be used here; Phosphor is the closest set that can, and it carries
# the outline/fill pair this UI already relies on for selected states.
phosphor = { module = "com.adamglin:phosphor-icon", version = "1.0.0" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
roborazzi = { id = "io.github.takahirom.roborazzi", version = "1.76.0" }
